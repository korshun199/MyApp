<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File Server</title>
    <style>
        :root { font-family: Inter, system-ui, -apple-system, sans-serif; color: #e8f1ff; background: #0b1729; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 18px; background: radial-gradient(circle at 15% 0%, #173964 0, #0b1729 48%, #07111f 100%); }
        main { max-width: 1180px; margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 22px; padding: 20px 22px; border: 1px solid #28466d; border-radius: 22px; background: linear-gradient(120deg, #0a1930, #163d6d 62%, #078eac); box-shadow: 0 18px 50px #02081777; }
        .eyebrow { margin: 0 0 6px; color: #7dd3fc; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; color: white; font-size: clamp(24px, 5vw, 34px); letter-spacing: -.03em; }
        .back, .upload-label { padding: 10px 14px; border: 1px solid #65d9eb; border-radius: 12px; color: white; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .upload { margin-bottom: 20px; }
        .upload-label { display: inline-block; cursor: pointer; background: #078eac; }
        .upload input { display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .card { min-height: 165px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #29476b; border-radius: 17px; background: #10223a; box-shadow: 0 12px 30px #02081766; }
        .preview { height: 100px; display: grid; place-items: center; overflow: hidden; border-radius: 11px; background: #0a1930; color: #7dd3fc; font-size: 42px; }
        .preview img { width: 100%; height: 100%; object-fit: cover; }
        .filename { display: block; overflow: hidden; margin-top: 12px; color: #e8f1ff; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
        .card a:hover, .back:hover, .upload-label:hover { color: white; border-color: #42e8c5; }
        @media (max-width: 520px) { body { padding: 10px; } header { align-items: flex-start; flex-direction: column; } .back, .upload-label { width: 100%; text-align: center; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
    </style>
</head>
<body>
<main>
    <header>
        <div><p class="eyebrow">MYAPP · VPS STORAGE</p><h1>File Server</h1></div>
        <a class="back" href="{{ url_for('app_page', tk=token) }}">← На главную</a>
    </header>
    <form class="upload" method="post" enctype="multipart/form-data" action="{{ url_for('files_page', tk=token) }}">
        <label class="upload-label">＋ Загрузить файл<input type="file" name="file" onchange="this.form.submit()"></label>
    </form>
    <section class="grid">
    {% for file in files %}
        <article class="card">
            <a class="preview" href="{{ url_for('file_download', filename=file, tk=token) }}" target="_blank" rel="noopener">
                {% if file.lower().endswith(('.jpg', '.jpeg', '.png', '.gif', '.webp')) %}
                    <img src="{{ url_for('file_download', filename=file, tk=token) }}" loading="lazy" alt="{{ file }}">
                {% else %}📄{% endif %}
            </a>
            <a class="filename" href="{{ url_for('file_download', filename=file, tk=token) }}" target="_blank" rel="noopener" title="{{ file }}">{{ file }}</a>
        </article>
    {% else %}
        <p>Каталог пока пуст.</p>
    {% endfor %}
    </section>
</main>
</body>
</html>
