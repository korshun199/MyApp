<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR-карточки ПВЗ</title>
    <style>
        :root { font-family: Inter, system-ui, -apple-system, sans-serif; color: #e8f1ff; background: #0b1729; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 18px; background: radial-gradient(circle at 15% 0%, #173964 0, #0b1729 48%, #07111f 100%); }
        main { max-width: 1180px; margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 22px; padding: 20px 22px; border: 1px solid #28466d; border-radius: 22px; background: linear-gradient(120deg, #0a1930, #163d6d 62%, #078eac); box-shadow: 0 18px 50px #02081777; }
        .eyebrow { margin: 0 0 6px; color: #7dd3fc; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; color: white; font-size: clamp(24px, 5vw, 34px); letter-spacing: -.03em; }
        .back { padding: 10px 14px; border: 1px solid #65d9eb; border-radius: 12px; color: white; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .card { padding: 9px; border: 1px solid #29476b; border-radius: 17px; background: #10223a; box-shadow: 0 12px 30px #02081766; }
        .card img { width: 100%; aspect-ratio: .706; object-fit: cover; border-radius: 11px; display: block; }
        .card a { display: block; margin-top: 9px; color: #7dd3fc; text-align: center; font-size: 13px; font-weight: 600; text-decoration: none; }
        .card a:hover, .back:hover { color: white; border-color: #42e8c5; }
        @media (max-width: 520px) { body { padding: 10px; } header { align-items: flex-start; flex-direction: column; } .back { width: 100%; text-align: center; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
    </style>
</head>
<body>
<main>
    <header>
        <div><p class="eyebrow">MYAPP · VPS GALLERY</p><h1>QR-карточки ПВЗ</h1></div>
        <a class="back" href="{{ url_for('app_page', tk=token) }}">← На главную</a>
    </header>
    <section class="grid">
    {% for image in images %}
        <div class="card">
            <a href="{{ url_for('pvz_image', filename=image, tk=token) }}" target="_blank" rel="noopener">
                <img src="{{ url_for('pvz_image', filename=image, tk=token) }}" loading="lazy" alt="QR-карточка ПВЗ {{ loop.index }}">
            </a>
            <a href="{{ url_for('pvz_image', filename=image, tk=token) }}" target="_blank" rel="noopener">Открыть оригинал</a>
        </div>
    {% endfor %}
    </section>
</main>
</body>
</html>
